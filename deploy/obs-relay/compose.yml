name: echo-obs
services:
  proxy:
    image: caddy:2-alpine
    container_name: echo-obs-proxy
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/data
      - ./caddy-config:/config
    healthcheck:
      test: [CMD, test, -s, /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/vps-ba7fb4cb.vps.ovh.ca/vps-ba7fb4cb.vps.ovh.ca.crt]
      interval: 5s
      timeout: 2s
      retries: 24
  media:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    image: echo-obs-media:1.21.3
    env_file: turn-client.env
    container_name: echo-obs-media
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    cpus: 0.75
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      proxy:
        condition: service_healthy
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./mediamtx.yml:/etc/mediamtx.yml:ro
      - ./tls:/certificates:ro
      - ./recordings:/recordings
  controller:
    image: node:22-alpine
    container_name: echo-obs-controller
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: private.env
    command: [node, /app/controller.cjs]
    volumes:
      - ./controller.cjs:/app/controller.cjs:ro
      - ./live-access.cjs:/app/live-access.cjs:ro
      - ./state:/data
      - ./recordings:/recordings
  turn:
    image: coturn/coturn:4.18.0-r0
    container_name: echo-obs-turn
    user: '0:0'
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -ec]
    command: ["test -r /etc/coturn/turnserver.conf && exec /usr/bin/turnserver -c /etc/coturn/turnserver.conf"]
    depends_on:
      proxy:
        condition: service_healthy
    tmpfs:
      - /tmp:size=4m
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./tls:/certificates:ro
