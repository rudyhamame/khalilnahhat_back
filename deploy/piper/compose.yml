services:
  piper:
    image: echo-piper:1.8.0
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8811:8000"
    environment:
      TTS_API_KEY: ${TTS_API_KEY:?Set TTS_API_KEY}
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
